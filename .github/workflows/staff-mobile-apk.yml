name: Build AirZen staff test APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: API environment embedded in the APK
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - codex/staff-mobile-app
    paths:
      - ".github/workflows/staff-mobile-apk.yml"
      - "staff-mobile/**"

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Android standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_AIRZEN_API_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'https://voice.airzensg.com' || 'http://fqrm2jezzq2855a2y61q5bsv.147.79.70.199.sslip.io' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: staff-mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and validate dependencies
        working-directory: staff-mobile
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit

      - name: Generate native Android project
        working-directory: staff-mobile
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Allow the isolated HTTP staging API in this test build
        if: env.EXPO_PUBLIC_AIRZEN_API_URL != 'https://voice.airzensg.com'
        working-directory: staff-mobile
        run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Build installable standalone APK
        working-directory: staff-mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the JavaScript bundle is packaged
        run: unzip -l staff-mobile/android/app/build/outputs/apk/release/app-release.apk | grep -F assets/index.android.bundle

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airzen-staff-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}-apk
          path: staff-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
