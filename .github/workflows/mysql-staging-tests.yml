name: MySQL staging integration tests

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/mysql-staging-tests.yml"
      - "airzen_repository.py"
      - "mysql_schema.sql"
      - "staff_mobile.py"
      - "staff_mobile_schema.sql"
      - "staff-mobile/**"
      - "mysql_migration_notes.md"
      - "requirements-dev.txt"
      - "requirements.txt"
      - "db.py"
      - "whatsapp.py"
      - "server.py"
      - "ui/index.html"
      - "agent.py"
      - "scripts/run_airzen_production_gate.py"
      - "supabase_schema.sql"
      - "whatsapp_health_test_migration.sql"
      - "tests/test_airzen_mysql_repository_integration.py"
      - "tests/test_airzen_repository_adapter.py"
      - "tests/test_staff_mobile.py"
      - "tests/test_staff_mobile_mysql_integration.py"
      - "tests/test_appointment_staff_configuration.py"
      - "tests/test_whatsapp_crm_linking.py"
      - "tests/test_whatsapp_booking_persistence.py"
      - "test_notification_outbox.py"
      - "test_critical_security.py"
      - "test_whatsapp_appointment_flow.py"
      - "test_whatsapp_automations.py"
      - "test_whatsapp_health_test.py"

permissions:
  contents: read

jobs:
  mysql-staging-tests:
    name: MySQL 8.4 staging validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: airzen_staging
          MYSQL_USER: airzen_staging
          MYSQL_PASSWORD: airzen-gh-actions-password
          MYSQL_ROOT_PASSWORD: airzen-gh-actions-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pairzen-gh-actions-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      AIRZEN_DB_BACKEND: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: airzen_staging
      MYSQL_USER: airzen_staging
      MYSQL_PASSWORD: airzen-gh-actions-password
      AIRZEN_ALLOW_MYSQL_STAGING_TESTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: staff-mobile/package-lock.json

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm isolated MySQL service
        run: |
          echo "Using MySQL host=${MYSQL_HOST}, port=${MYSQL_PORT}, database=${MYSQL_DATABASE}, user=${MYSQL_USER}"
          mysql --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user=root --password="airzen-gh-actions-root-password" --execute="SELECT VERSION() AS mysql_version;"

      - name: Wait for MySQL health
        run: |
          for i in {1..60}; do
            if mysqladmin ping --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user=root --password="airzen-gh-actions-root-password" --silent; then
              echo "MySQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become healthy in time"
          exit 1

      - name: Apply MySQL schema
        run: |
          mysql --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user="${MYSQL_USER}" --password="${MYSQL_PASSWORD}" "${MYSQL_DATABASE}" < mysql_schema.sql
          mysql --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" --user="${MYSQL_USER}" --password="${MYSQL_PASSWORD}" "${MYSQL_DATABASE}" < staff_mobile_schema.sql

      - name: Run real MySQL integration tests
        env:
          PYTEST_ADDOPTS: "--junitxml=mysql-integration-results.xml"
        run: python -m pytest tests/test_airzen_mysql_repository_integration.py tests/test_staff_mobile_mysql_integration.py -q

      - name: Fail if MySQL integration tests skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("mysql-integration-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)

          print(f"MySQL integration summary: tests={tests}, skipped={skipped}, failures={failures}, errors={errors}")
          if tests != 14:
              sys.exit(f"Expected exactly 14 MySQL integration tests to execute, got {tests}")
          if skipped:
              sys.exit(f"MySQL integration tests must not skip; skipped={skipped}")
          if failures or errors:
              sys.exit(f"MySQL integration tests failed; failures={failures}, errors={errors}")
          PY

      - name: Run full pytest
        run: python -m pytest -q

      - name: Run WhatsApp automation dry-run
        run: python scripts/test_whatsapp_automations.py --mode dry-run --all

      - name: Validate Android staff app
        working-directory: staff-mobile
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit
          npx expo export --platform android --output-dir dist-validation --clear

      - name: Compile critical Python files
        run: python -m py_compile server.py db.py whatsapp.py airzen_repository.py staff_mobile.py scripts/run_airzen_production_gate.py

      - name: Check diff whitespace
        run: git diff --check
